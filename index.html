<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: sans-serif;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 80%;
        }
        h1 { color: #ff4757; }
        .bday-img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ff4757;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- මෙතැනට ඔබේ Google Drive Image Link එක දමන්න -->
        <img src="https://drive.google.com/thumbnail?id=ඔබගේ_IMAGE_ID_එක&sz=w1000" class="bday-img" alt="Birthday Photo">
        
        <h1>🎂 Happy Birthday! 🎈</h1>
        <p>ඔයාගේ හැම හීනයක්ම සැබෑවෙන ලස්සන අනාගතයකට සුභ පතනවා! ❤️</p>
    </div>
</body>
</html>
